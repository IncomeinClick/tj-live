<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TJ Live — Present</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800;900&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/alpinejs@3/dist/cdn.min.js" defer></script>
<style>
:root{
  --bg:#060807;--text:#eef2f0;--text-muted:#7d8a84;
  --accent:#00e676;--accent-soft:rgba(0,230,118,0.14);--accent-line:rgba(0,230,118,0.28);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Sarabun',sans-serif;overflow:hidden;cursor:default}
h1,h2,h3{font-family:'Kanit',sans-serif;font-weight:800;line-height:1.15}

/* ── Ambient background: radial glow + orbit motif (echoes the Newton "N") ── */
.bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-fx .glow{position:absolute;top:-25%;right:-10%;width:75vw;height:75vw;
  background:radial-gradient(circle,rgba(0,230,118,0.10) 0%,rgba(0,230,118,0) 60%);}
.bg-fx .glow2{position:absolute;bottom:-30%;left:-15%;width:60vw;height:60vw;
  background:radial-gradient(circle,rgba(0,230,118,0.05) 0%,rgba(0,230,118,0) 60%);}
.bg-fx .orbit{position:absolute;border:1px solid var(--accent-line);border-radius:50%;opacity:0.10;
  top:50%;left:50%;transform:translate(-50%,-50%) rotate(-24deg)}
.bg-fx .orbit.o1{width:120vw;height:52vw}
.bg-fx .orbit.o2{width:86vw;height:34vw;opacity:0.07}

/* ── Fixed chrome (camera lives bottom-left → keep that corner clear) ── */
.chrome{position:fixed;inset:0;z-index:5;pointer-events:none}
.brand-mark{position:fixed;top:26px;right:38px;z-index:7;display:flex;align-items:center;gap:14px;
  opacity:0.95;text-decoration:none;transition:opacity 0.2s}
.brand-mark:hover{opacity:1}
.brand-mark img{height:52px}
.brand-mark .wm{font-family:'Kanit',sans-serif;font-weight:700;font-size:1.35em;color:var(--text);line-height:1}
.brand-mark .wm small{display:block;font-size:0.55em;font-weight:500;color:var(--text-muted);letter-spacing:0.14em;margin-top:2px}
.hint{position:fixed;bottom:18px;right:30px;font-size:0.78em;color:var(--text-muted);
  transition:opacity 0.6s;display:flex;gap:14px;align-items:center}
.hint kbd{font-family:'Kanit',sans-serif;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);
  border-radius:6px;padding:2px 8px;font-size:0.9em;color:var(--text)}

/* ── Stage ── */
.stage{position:relative;z-index:2;height:100vh;width:100%;
  display:flex;align-items:center;justify-content:center;
  /* keep content out of the bottom-left camera zone */
  padding:80px 64px 140px 64px}
.slide{width:100%;max-width:1100px;text-align:center}

/* Cover slide — the live's title, like a chapter heading */
.cover{display:flex;flex-direction:column;align-items:center;gap:32px;animation:fadeUp 0.7s ease}
.cover .cover-title{font-family:'Kanit',sans-serif;font-weight:900;font-size:clamp(2.6em,6.5vw,5em);
  color:#fff;line-height:1.12;max-width:1150px;text-shadow:0 0 40px rgba(0,230,118,0.12)}
.cover .cover-rule{width:120px;height:4px;background:var(--accent);border-radius:2px;box-shadow:0 0 18px var(--accent)}

/* Topic slide — decorative orbit accent (Newton motif, NOT a sequence number) */
.topic-accent{position:relative;width:50px;height:50px;margin:0 auto 26px}
.topic-accent .ring{position:absolute;inset:0;border:2px solid var(--accent-line);border-radius:50%;
  transform:rotate(-24deg)}
.topic-accent .ring::after{content:'';position:absolute;width:9px;height:9px;background:var(--accent);
  border-radius:50%;top:-4.5px;left:50%;margin-left:-4.5px;box-shadow:0 0 12px var(--accent)}
.topic-title{font-size:clamp(2.2em,5.5vw,4em);color:#fff;margin-bottom:40px;
  animation:fadeUp 0.6s ease}
.bullets{display:inline-flex;flex-direction:column;gap:18px;text-align:left;max-width:980px}
.bullet{font-size:clamp(1.3em,2.9vw,2em);line-height:1.5;position:relative;
  padding-left:calc(42px + var(--lv,0) * 40px);
  opacity:0;transform:translateY(14px);transition:opacity 0.5s ease,transform 0.5s ease;color:var(--text)}
.bullet.show{opacity:1;transform:translateY(0)}
.bullet::before{content:'';position:absolute;left:calc(6px + var(--lv,0) * 40px);top:0.62em;width:16px;height:3px;
  background:var(--accent);border-radius:2px;box-shadow:0 0 8px var(--accent-soft)}
.bullet.lv1,.bullet.lv2{color:var(--text-muted)}
.bullet.lv1{font-size:0.82em}
.bullet.lv2{font-size:0.72em}
.bullet.lv1::before,.bullet.lv2::before{width:10px;background:var(--text-muted);box-shadow:none;top:0.6em}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ── Mind map mode (same topics/bullets, drawn as a map) ── */
.map-stage{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;overflow:hidden;
  cursor:grab;user-select:none}
.map-stage.grabbing{cursor:grabbing}
.map-fit{flex:0 0 auto;width:3600px;height:2100px;transform-origin:50% 50%}
.map-canvas{position:relative;width:3600px;height:2100px;transform-origin:0 0;
  transition:transform 0.85s cubic-bezier(.4,0,.2,1)}
.map-canvas.dragging{transition:none}
.map-edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.map-edges path{fill:none;opacity:0;transition:opacity 0.5s ease}
.map-edges path.show{opacity:1}
.mnode{position:absolute}
.mnode .mlabel{display:inline-block;opacity:0;transform:scale(.88);
  transition:opacity 0.45s ease,transform 0.45s cubic-bezier(.34,1.4,.64,1)}
.mnode.show .mlabel{opacity:1;transform:scale(1)}
.mnode.anchor-r{transform:translate(0,-50%);text-align:left}
.mnode.anchor-l{transform:translate(-100%,-50%);text-align:right}
.mnode.anchor-c{transform:translate(-50%,-50%);text-align:center}
.mnode.root .mlabel{font-family:'Kanit',sans-serif;font-weight:900;font-size:66px;line-height:1.15;
  color:#fff;max-width:780px;padding:26px 42px;border:2px solid var(--accent-line);border-radius:28px;
  background:rgba(0,230,118,0.07);box-shadow:0 0 60px rgba(0,230,118,0.13)}
.mnode.topic .mlabel{font-family:'Kanit',sans-serif;font-weight:700;font-size:44px;line-height:1.2;
  color:#fff;max-width:560px;padding:16px 30px;border:2px solid var(--accent);border-radius:20px;
  background:rgba(0,230,118,0.10)}
.mnode.bullet .mlabel{font-size:32px;line-height:1.35;color:var(--text);max-width:430px;
  padding:8px 14px;border-bottom:3px solid var(--accent)}
.mnode.sub .mlabel{font-size:26px;line-height:1.35;color:var(--text-muted);max-width:400px;
  padding:6px 12px;border-bottom:2px solid rgba(255,255,255,0.18)}
.mnode.sub2 .mlabel{font-size:21px;max-width:330px;border-bottom-width:1px}

/* Zoom controls — bottom-right, above the key hints */
.map-zoom{position:fixed;right:30px;bottom:58px;z-index:6;display:flex;gap:8px;align-items:center}
.map-zoom button{width:42px;height:42px;border-radius:12px;cursor:pointer;
  background:rgba(255,255,255,0.05);border:1px solid rgba(0,230,118,0.35);color:var(--text);
  font-family:'Kanit',sans-serif;font-size:1.15em;line-height:1;transition:background 0.2s,border-color 0.2s}
.map-zoom button:hover{background:rgba(0,230,118,0.16);border-color:var(--accent)}
.map-zoom .lvl{min-width:56px;text-align:center;font-size:0.8em;color:var(--text-muted)}

@media (max-width:899px){
  .stage{padding:80px 24px 120px}
  .brand-mark{top:16px;right:18px;gap:9px}
  .brand-mark img{height:36px}
  .brand-mark .wm{font-size:1em}
}
</style>
</head>
<body x-data="liveApp()" x-init="init()" @keydown.window="onKey($event)" @resize.window="fit()"
      @mousemove.window="onPan($event)" @mouseup.window="endPan()" @click="onStageClick()">

<div class="bg-fx">
  <div class="glow"></div><div class="glow2"></div>
  <div class="orbit o1"></div><div class="orbit o2"></div>
</div>

<!-- Top-right: Newton brand mark -->
<a class="brand-mark" href="https://newton.incomeinclick.in.th" target="_blank" rel="noopener"
   @click.stop @mousedown.stop>
  <img src="/assets/newton-n.png" alt="Newton">
  <div class="wm">Newton<small>AI THAT WORKS</small></div>
</a>

<!-- Stage -->
<div class="stage" x-show="view==='slides'">

  <!-- COVER (chapter title) -->
  <template x-if="cur.type==='cover'">
    <div class="slide cover">
      <div class="topic-accent"><div class="ring"></div></div>
      <h1 class="cover-title" x-text="project.title || ' '"></h1>
      <div class="cover-rule"></div>
    </div>
  </template>

  <!-- TOPIC -->
  <template x-if="cur.type==='topic'">
    <div class="slide">
      <div class="topic-accent"><div class="ring"></div></div>
      <h1 class="topic-title" x-text="cur.title"></h1>
      <div class="bullets">
        <template x-for="(b,i) in cur.bullets" :key="b.id">
          <div class="bullet" :class="'lv' + (b.level || 0) + (i < revealed ? ' show' : '')"
               :style="'--lv:' + (b.level || 0)" x-text="b.text"></div>
        </template>
      </div>
    </div>
  </template>

</div>

<!-- MIND MAP (same data as the slides, one branch per topic) -->
<div class="map-stage" x-show="view==='map'" :class="{'grabbing': dragging}" @mousedown="startPan($event)">
  <div class="map-fit" :style="'transform:scale(' + baseScale + ')'">
    <div class="map-canvas" :class="{'dragging': dragging}" :style="mapTransform">
      <svg class="map-edges" id="mapEdges" viewBox="0 0 3600 2100"></svg>
      <template x-for="nd in map.nodes" :key="nd.id">
        <div class="mnode" :data-id="nd.id" :class="nd.cls + (vis(nd) ? ' show' : '')"
             :style="'left:' + nd.x + 'px;top:' + nd.y + 'px'">
          <span class="mlabel" x-text="nd.text"></span>
        </div>
      </template>
    </div>
  </div>
</div>

<!-- Zoom controls (map only) -->
<div class="map-zoom" x-show="view==='map'" @mousedown.stop @click.stop>
  <button @click="zoomBy(0.8)" title="ซูมออก">−</button>
  <span class="lvl" x-text="Math.round(userZoom * 100) + '%'"></span>
  <button @click="zoomBy(1.25)" title="ซูมเข้า">+</button>
  <button @click="resetView()" title="รีเซ็ตมุมมอง">⤾</button>
</div>

<!-- Bottom-right hint (auto-fades) -->
<div class="hint" :style="'opacity:' + (hintVisible ? 0.7 : 0)">
  <span><kbd>←</kbd> <kbd>→</kbd> เลื่อน</span>
  <span><kbd>M</kbd> <span x-text="view==='map' ? 'สไลด์' : 'แผนที่'"></span></span>
  <span x-show="view==='map'"><kbd>0</kbd> รีเซ็ตมุมมอง</span>
  <span x-show="view==='map'">ลากเมาส์ = เลื่อนแผนที่</span>
  <span><kbd>F</kbd> เต็มจอ</span>
</div>

<script>
// Mind map canvas — a fixed logical 16:9 space, scaled to fit the screen.
const MW = 3600, MH = 2100, MCX = 1800, MCY = 1050;
// One ring per depth: topics, bullets, subs, sub-subs.
const RINGS = [[820, 520], [1320, 900], [1780, 1150], [2160, 1350]];

function liveApp() {
  return {
    project: {},
    idx: 0,
    revealed: 0,
    hintVisible: true,
    view: new URLSearchParams(location.search).get('view') === 'map' ? 'map' : 'slides',
    map: { nodes: [], edges: [] },
    baseScale: 1,
    home: { k: 1, fx: MCX, fy: MCY },
    panX: 0, panY: 0, dragging: false, drag: null, moved: 0, userZoom: 1,

    get slides() {
      const topics = (this.project.topics || []).map(tp => ({
        type: 'topic', title: tp.title, bullets: tp.bullets || []
      }));
      return [{ type: 'cover' }, ...topics];
    },
    get cur() { return this.slides[this.idx] || { type: 'topic', title: this.project.title || '', bullets: [] }; },

    async init() {
      const id = window.location.pathname.split('/').pop();
      const token = localStorage.getItem('tj-token') || '';
      const r = await fetch('/api/projects/' + id, { headers: { 'Authorization': 'Bearer ' + token } });
      if (r.ok) this.project = await r.json();
      setTimeout(() => { this.hintVisible = false; }, 4000);

      this.buildMap();
      this.fit();
      this.$nextTick(() => this.refreshMap());
      // Labels change width once the webfonts land, and can't be measured at
      // all while the map is hidden — remeasure on both.
      if (document.fonts) document.fonts.ready.then(() => this.refreshMap());
      this.$watch('view', v => { if (v === 'map') this.$nextTick(() => this.refreshMap()); });
      this.$watch('idx', () => this.syncEdges());
      this.$watch('revealed', () => this.syncEdges());
    },

    // ── Mind map: same project tree, laid out radially ──
    pol(deg, rx, ry) {
      const r = deg * Math.PI / 180;
      return [MCX + rx * Math.cos(r), MCY + ry * Math.sin(r)];
    },
    anchor(deg) { return Math.cos(deg * Math.PI / 180) >= 0 ? 'anchor-r' : 'anchor-l'; },

    // Flat bullet list + level → a real tree. A level that skips a step
    // (level 2 with no level 1 above it) is pulled back to a valid depth.
    treeify(bullets) {
      const roots = [], open = [];
      bullets.forEach((b, fi) => {
        const lv = Math.min(Math.max(0, b.level || 0), open.length);
        const node = { b, fi, kids: [] };
        if (lv === 0) roots.push(node); else open[lv - 1].kids.push(node);
        open[lv] = node;
        open.length = lv + 1;
      });
      return roots;
    },

    leaves(n) { return n.kids.length ? n.kids.reduce((s, k) => s + this.leaves(k), 0) : 1; },

    buildMap() {
      const topics = this.project.topics || [];
      const root = { id: 'root', cls: 'root anchor-c', x: MCX, y: MCY, text: this.project.title || '', ti: -1, fi: -1 };
      const nodes = [root];
      const edges = [];
      const sector = 360 / (topics.length || 1);

      // Each child takes a slice of its parent's wedge, sized by how many
      // leaves hang off it, and sits one ring further out.
      const place = (kids, centre, span, depth, parent, ti) => {
        const total = kids.reduce((s, k) => s + this.leaves(k), 0) || 1;
        let cur = centre - span / 2;
        kids.forEach(k => {
          const slice = span * this.leaves(k) / total;
          const ang = cur + slice / 2;
          cur += slice;
          const ring = RINGS[Math.min(depth, RINGS.length - 1)];
          const [x, y] = this.pol(ang, ring[0], ring[1]);
          const tier = depth === 1 ? 'bullet' : (depth === 2 ? 'sub' : 'sub sub2');
          const node = { id: 'n' + ti + '-' + k.fi, cls: tier + ' ' + this.anchor(ang), x, y, text: k.b.text, ti, fi: k.fi };
          nodes.push(node);
          edges.push({
            parent, to: [x, y], node,
            color: depth === 1 ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.14)',
            w: depth === 1 ? 3 : 2,
          });
          place(k.kids, ang, slice * 0.8, depth + 1, node, ti);
        });
      };

      topics.forEach((tp, ti) => {
        const a = -90 + sector * (ti + 0.5);
        const [tx, ty] = this.pol(a, RINGS[0][0], RINGS[0][1]);
        const tnode = { id: 't' + ti, cls: 'topic anchor-c', x: tx, y: ty, text: tp.title, ti, fi: -1 };
        nodes.push(tnode);
        edges.push({ parent: root, to: [tx, ty], node: tnode, color: 'rgba(0,230,118,0.45)', w: 4 });
        // Cap the fan: with one or two topics a full sector would wrap the
        // branches right around the centre.
        place(this.treeify(tp.bullets || []), a, Math.min(sector * 0.76, 150), 1, tnode, ti);
      });

      this.map = { nodes, edges };
    },

    // A node shows once the live has reached it — the map grows as Pond clicks.
    vis(nd) {
      if (nd.ti < 0) return true;
      const cti = this.idx - 1;
      if (nd.ti < cti) return true;
      if (nd.ti > cti) return false;
      return nd.fi < 0 ? true : nd.fi < this.revealed;
    },

    // Real rendered size of each label, so lines and zoom respect the text
    // instead of guessing at it (depths differ in font size).
    measure() {
      document.querySelectorAll('.map-canvas .mnode').forEach(el => {
        const nd = this.map.nodes.find(n => n.id === el.dataset.id);
        const lb = el.querySelector('.mlabel');
        if (nd && lb) { nd.w = lb.offsetWidth; nd.h = lb.offsetHeight; }
      });
    },

    // Where a line leaving a label should start: the point on that label's
    // box facing the child, so no line is drawn across its own text.
    boxExit(nd, tx, ty, pad) {
      const w = nd.w || 260, h = nd.h || 70;
      const c = nd.cls;
      const cx = c.includes('anchor-r') ? nd.x + w / 2 - 6
               : c.includes('anchor-l') ? nd.x - w / 2 + 6 : nd.x;
      const dx = tx - cx, dy = ty - nd.y;
      const hw = w / 2 + pad, hh = h / 2 + pad;
      const t = Math.min(
        Math.abs(dx) > 0.001 ? hw / Math.abs(dx) : Infinity,
        Math.abs(dy) > 0.001 ? hh / Math.abs(dy) : Infinity,
        0.9,
      );
      return [cx + dx * t, nd.y + dy * t];
    },

    // Gentle bow along the parent→child line: a radial map reads badly when
    // the curves swing wide enough to cross a neighbouring branch.
    edgePath(from, to) {
      const [x1, y1] = from;
      const [x2, y2] = to;
      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      const bow = Math.min(len * 0.10, 80);
      const c1x = x1 + dx * 0.35 + nx * bow, c1y = y1 + dy * 0.35 + ny * bow;
      const c2x = x1 + dx * 0.72 + nx * bow * 0.5, c2y = y1 + dy * 0.72 + ny * bow * 0.5;
      return `M${x1},${y1} C${c1x},${c1y} ${c2x},${c2y} ${x2},${y2}`;
    },

    // Paths are built once so the fade-in transition survives a re-render.
    drawEdges() {
      const svg = document.getElementById('mapEdges');
      if (!svg) return;
      svg.innerHTML = '';
      this.map.edges.forEach(e => {
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', this.edgePath(this.boxExit(e.parent, e.to[0], e.to[1], 14), e.to));
        p.setAttribute('stroke', e.color);
        p.setAttribute('stroke-width', e.w);
        p.setAttribute('stroke-linecap', 'round');
        e.el = p;
        svg.appendChild(p);
      });
    },
    syncEdges() {
      this.map.edges.forEach(e => e.el && e.el.classList.toggle('show', this.vis(e.node)));
    },
    refreshMap() {
      this.measure();
      this.declutter();
      this.home = this.frame(this.map.nodes, 0.3, 1.4);
      this.drawEdges();
      this.syncEdges();
    },

    // The rendered box of a label in canvas coordinates.
    box(nd) {
      const w = nd.w || 260, h = nd.h || 70;
      const c = nd.cls;
      const x1 = c.includes('anchor-r') ? nd.x - 8
               : c.includes('anchor-l') ? nd.x - w + 8 : nd.x - w / 2;
      return { x1, x2: x1 + w, y1: nd.y - h / 2, y2: nd.y + h / 2 };
    },

    // Angles alone don't keep labels apart — two branches can end up at the
    // same height with wide text. Slide overlapping labels vertically until
    // nothing touches. Spreading out is fine; the map pans and zooms.
    declutter() {
      const list = this.map.nodes.filter(n => n.id !== 'root');
      const GAP_X = 34, GAP_Y = 22;
      for (let pass = 0; pass < 160; pass++) {
        let moved = false;
        for (let i = 0; i < list.length; i++) {
          for (let j = i + 1; j < list.length; j++) {
            const A = list[i], B = list[j];
            const a = this.box(A), b = this.box(B);
            const overX = Math.min(a.x2, b.x2) - Math.max(a.x1, b.x1) + GAP_X;
            const overY = Math.min(a.y2, b.y2) - Math.max(a.y1, b.y1) + GAP_Y;
            if (overX <= 0 || overY <= 0) continue;
            const push = overY / 2 + 0.5;
            if (A.y <= B.y) { A.y -= push; B.y += push; } else { A.y += push; B.y -= push; }
            moved = true;
          }
        }
        if (!moved) break;
      }
    },

    fit() { this.baseScale = Math.min(window.innerWidth / MW, window.innerHeight / MH); },

    // How much room a node's label takes, so zoom never clips text.
    extent(nd) {
      const c = nd.cls;
      const w = nd.w || (c.includes('root') ? 700 : c.includes('topic') ? 520 : 380);
      const h = (nd.h || 90) / 2 + 20;
      if (c.includes('anchor-l')) return [nd.x - w - 10, nd.x + 20, nd.y - h, nd.y + h];
      if (c.includes('anchor-r')) return [nd.x - 20, nd.x + w + 10, nd.y - h, nd.y + h];
      return [nd.x - w / 2 - 10, nd.x + w / 2 + 10, nd.y - h, nd.y + h];
    },

    frame(list, minK, maxK) {
      let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
      list.forEach(nd => {
        const [a, b, c, d] = this.extent(nd);
        x1 = Math.min(x1, a); x2 = Math.max(x2, b);
        y1 = Math.min(y1, c); y2 = Math.max(y2, d);
      });
      const pad = 120;
      const k = Math.min(maxK, Math.max(minK, Math.min(MW / (x2 - x1 + pad * 2), MH / (y2 - y1 + pad * 2))));
      return { k, fx: (x1 + x2) / 2, fy: (y1 + y2) / 2 };
    },

    zoomBy(f) { this.userZoom = Math.min(4, Math.max(0.25, this.userZoom * f)); },
    resetView() { this.userZoom = 1; this.panX = 0; this.panY = 0; },

    // ── Drag the map around with the mouse ──
    startPan(e) {
      this.moved = 0;
      if (this.view !== 'map' || e.button !== 0) return;
      this.drag = { x: e.clientX, y: e.clientY };
      this.dragging = true;
    },
    onPan(e) {
      if (!this.drag) return;
      const dx = e.clientX - this.drag.x, dy = e.clientY - this.drag.y;
      this.drag = { x: e.clientX, y: e.clientY };
      this.moved += Math.abs(dx) + Math.abs(dy);
      const s = this.baseScale || 1;
      this.panX += dx / s;
      this.panY += dy / s;
    },
    endPan() { this.drag = null; this.dragging = false; },

    // A drag must not double as a "next" click.
    onStageClick() {
      if (this.moved > 6) { this.moved = 0; return; }
      this.next();
    },

    // The view belongs to the presenter: revealing a node never moves the
    // camera. It changes only by dragging, the zoom buttons, or a reset.
    get mapTransform() {
      // Bias the framing right + up: the camera sits bottom-left on the stream.
      const k = this.home.k * this.userZoom;
      const tx = MCX + 110 - this.home.fx * k + this.panX;
      const ty = MCY - 80 - this.home.fy * k + this.panY;
      return `transform: translate(${tx}px, ${ty}px) scale(${k})`;
    },

    next() {
      const s = this.cur;
      if (s.type === 'topic' && this.revealed < s.bullets.length) { this.revealed++; return; }
      if (this.idx < this.slides.length - 1) { this.idx++; this.revealed = 0; }
    },
    prev() {
      const s = this.cur;
      if (s.type === 'topic' && this.revealed > 0) { this.revealed--; return; }
      if (this.idx > 0) {
        this.idx--;
        const p = this.cur;
        this.revealed = p.type === 'topic' ? p.bullets.length : 0;
      }
    },

    onKey(e) {
      const k = e.key;
      if (k === 'ArrowRight' || k === ' ' || k === 'ArrowDown' || k === 'PageDown' || k === 'Enter') { e.preventDefault(); this.next(); }
      else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); this.prev(); }
      else if (k === 'm' || k === 'M') { this.view = this.view === 'map' ? 'slides' : 'map'; }
      else if (k === '0') { this.resetView(); }
      else if (k === 'f' || k === 'F') { this.toggleFs(); }
      else if (k === 'Home') { this.idx = 0; this.revealed = 0; }
      else if (k === 'End') { this.idx = this.slides.length - 1; this.revealed = 0; }
    },

    toggleFs() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    }
  };
}
</script>
</body>
</html>
